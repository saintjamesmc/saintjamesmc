<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SJA Server</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Background container */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
        }

        .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 110%;
            height: 110%;
            background-size: cover;
            background-position: center;
            filter: blur(8px);
            opacity: 0;
            transition: opacity 2s ease-in-out;
            animation: slowPan 30s ease-in-out infinite alternate;
        }

        .background-image.active {
            opacity: 1;
        }

        @keyframes slowPan {
            0% {
                transform: translate(0, 0) scale(1.1);
            }
            25% {
                transform: translate(-5%, -5%) scale(1.15);
            }
            50% {
                transform: translate(-5%, 5%) scale(1.1);
            }
            75% {
                transform: translate(5%, -5%) scale(1.12);
            }
            100% {
                transform: translate(0, 0) scale(1.1);
            }
        }

        /* Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* Light mode (default) */
        @media (prefers-color-scheme: light) {
            .overlay {
                background: rgba(255, 255, 255, 0.85);
            }
            
            .content {
                color: #1a1a1a;
            }
        }

        /* Dark mode */
        @media (prefers-color-scheme: dark) {
            .overlay {
                background: rgba(0, 0, 0, 0.75);
            }
            
            .content {
                color: #f0f0f0;
            }
        }

        /* Content */
        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .server-info {
            max-width: 600px;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .subtitle {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            opacity: 0.8;
        }

        .server-address {
            font-size: 1.25rem;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            margin: 2rem 0;
            cursor: pointer;
            transition: transform 0.2s;
        }

        @media (prefers-color-scheme: light) {
            .server-address {
                background: rgba(0, 0, 0, 0.05);
            }
            .server-address:hover {
                background: rgba(0, 0, 0, 0.1);
            }
        }

        @media (prefers-color-scheme: dark) {
            .server-address {
                background: rgba(255, 255, 255, 0.1);
            }
            .server-address:hover {
                background: rgba(255, 255, 255, 0.15);
            }
        }

        .server-address:hover {
            transform: scale(1.05);
        }

        .bedrock-section {
            margin: 2rem 0;
            padding: 1.5rem;
            border-radius: 12px;
        }

        @media (prefers-color-scheme: light) {
            .bedrock-section {
                background: rgba(76, 175, 80, 0.1);
                border: 2px solid rgba(76, 175, 80, 0.3);
            }
        }

        @media (prefers-color-scheme: dark) {
            .bedrock-section {
                background: rgba(76, 175, 80, 0.15);
                border: 2px solid rgba(76, 175, 80, 0.4);
            }
        }

        .bedrock-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .bedrock-info {
            font-size: 1.1rem;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        @media (prefers-color-scheme: light) {
            .bedrock-info {
                background: rgba(0, 0, 0, 0.03);
            }
            .bedrock-info:hover {
                background: rgba(0, 0, 0, 0.08);
            }
        }

        @media (prefers-color-scheme: dark) {
            .bedrock-info {
                background: rgba(255, 255, 255, 0.08);
            }
            .bedrock-info:hover {
                background: rgba(255, 255, 255, 0.12);
            }
        }

        .bedrock-info:hover {
            transform: scale(1.02);
        }

        .info-text {
            line-height: 1.8;
            margin-top: 1.5rem;
            opacity: 0.9;
        }

        .map-link {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s;
        }

        @media (prefers-color-scheme: light) {
            .map-link {
                background: #2196F3;
                color: white;
            }
            .map-link:hover {
                background: #1976D2;
            }
        }

        @media (prefers-color-scheme: dark) {
            .map-link {
                background: #42A5F5;
                color: #000;
            }
            .map-link:hover {
                background: #64B5F6;
            }
        }

        .map-link:hover {
            transform: translateY(-2px);
        }

        /* Lesson Page Overlay */
        #lessonPage {
            position: fixed;
            top: 100vh;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 1000;
            transition: top 0.5s ease;
            display: flex;
            flex-direction: column;
        }

        #lessonPage.active {
            top: 0;
        }

        #main-container {
            transition: transform 0.5s ease;
        }

        #main-container.slide-down {
            transform: translateY(-100vh);
        }

        .lesson-header {
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid;
        }

        @media (prefers-color-scheme: light) {
            #lessonPage {
                background: white;
            }
            .lesson-header {
                background: rgba(255, 255, 255, 0.98);
                border-bottom-color: rgba(0, 0, 0, 0.1);
            }
            .close-btn {
                background: #f44336;
                color: white;
            }
            .close-btn:hover {
                background: #d32f2f;
            }
        }

        @media (prefers-color-scheme: dark) {
            #lessonPage {
                background: #1a1a1a;
            }
            .lesson-header {
                background: rgba(30, 30, 30, 0.98);
                border-bottom-color: rgba(255, 255, 255, 0.1);
            }
            .close-btn {
                background: #f44336;
                color: white;
            }
            .close-btn:hover {
                background: #ff5252;
            }
        }

        #lessonTitle {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0;
        }

        .close-btn {
            padding: 0.5rem 1.5rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        #lessonFrame {
            flex: 1;
            border: none;
            width: 100%;
        }

        .lesson-frame {
            border: none;
        }
    </style>
</head>
<body>
    <div id="main-container">
        <div class="background" id="background"></div>
        <div class="overlay"></div>
        
        <div class="content">
        <div class="server-info" id="server-info-container">
            <p style="opacity: 0.7;">Loading server information...</p>
        </div>
    </div>
    </div>

    <div id="lessonPage">
        <div class="lesson-header">
            <h2 id="lessonTitle">Loading...</h2>
            <button class="close-btn" onclick="closeLessonPage()">Close</button>
        </div>
        <iframe id="lessonFrame" class="lesson-frame" frameborder="0" src=""
                sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads"></iframe>
    </div>

    <script>
        // Background images
        const baseUrl = 'https://map.sja-mc.cfd/tiles/';
        const worldType = String.fromCharCode(109,105,110,101,99,114,97,102,116) + '_overworld/3/';
        const tiles = ['-8_-19', '-8_-20', '-9_-19', '-7_-19', '-8_-18', '-9_-20', '-7_-20', '-9_-18', '-7_-18'];
        const images = tiles.map(tile => baseUrl + worldType + tile + '.png');

        let currentIndex = 0;
        const background = document.getElementById('background');

        // Create background image elements
        images.forEach((img, index) => {
            const div = document.createElement('div');
            div.className = 'background-image';
            div.style.backgroundImage = `url('${img}')`;
            if (index === 0) {
                div.classList.add('active');
            }
            background.appendChild(div);
        });

        // Rotate backgrounds
        function rotateBackground() {
            const elements = document.querySelectorAll('.background-image');
            elements[currentIndex].classList.remove('active');
            currentIndex = (currentIndex + 1) % images.length;
            elements[currentIndex].classList.add('active');
        }

        // Change background every 5 seconds
        setInterval(rotateBackground, 5000);

        // Text scramble effect
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';
        const secretWord = String.fromCharCode(77,105,110,101,99,114,97,102,116);
        
        function getRandomChar() {
            return chars[Math.floor(Math.random() * chars.length)];
        }

        function scrambleText(element, text) {
            let scrambled = '';
            for (let i = 0; i < text.length; i++) {
                scrambled += getRandomChar();
            }
            element.textContent = scrambled;
            element.dataset.original = text;
        }

        function unscrambleText(element) {
            const originalText = element.dataset.original;
            const currentText = element.textContent;
            let revealed = '';
            let complete = true;

            for (let i = 0; i < originalText.length; i++) {
                if (currentText[i] !== originalText[i]) {
                    if (Math.random() < 0.3) {
                        revealed += originalText[i];
                    } else {
                        revealed += getRandomChar();
                        complete = false;
                    }
                } else {
                    revealed += originalText[i];
                }
            }

            element.textContent = revealed;
            return complete;
        }

        // Wait for page to fully load
        window.addEventListener('load', () => {
            // Load server info from CDN
            fetch('https://cdn.jsdelivr.net/gh/saintjamesmc/saintjamesmc@master/overlay/index.html')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('server-info-container').innerHTML = html;
                    
                    // Initialize scramble effect after content is loaded
                    const scrambleElements = document.querySelectorAll('.scramble');
                    scrambleElements.forEach(el => scrambleText(el, secretWord));

                    // Reveal text 0.25 seconds after content loads
                    setTimeout(() => {
                        scrambleElements.forEach(el => {
                            el.textContent = el.dataset.original;
                        });
                    }, 250);
                })
                .catch(error => {
                    console.error('Error loading server info:', error);
                    document.getElementById('server-info-container').innerHTML = '<p style="opacity: 0.7;">Failed to load server information. Please refresh the page.</p>';
                });
        });

        // Copy to clipboard function
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                const addressDiv = document.querySelector('.server-address');
                const originalText = addressDiv.innerHTML;
                addressDiv.innerHTML = '✓ Copied to clipboard!';
                setTimeout(() => {
                    addressDiv.innerHTML = originalText;
                }, 2000);
            });
        }

        // Lesson page functions
        function openLessonFromCDN(title, url) {
            document.getElementById('lessonTitle').textContent = title;
            fetch(url)
                .then(response => response.text())
                .then(html => {
                    const iframe = document.getElementById('lessonFrame');
                    iframe.srcdoc = html;
                })
                .catch(error => console.error('Error loading content:', error));
            document.getElementById('lessonPage').classList.add('active');
            document.getElementById('main-container').classList.add('slide-down');
        }


        // Load content from GitHub CDN
        // Example: openLessonFromCDN('Server Info', 'https://cdn.jsdelivr.net/gh/saintjamesmc/saintjamesmc@master/index.html');
        function closeLessonPage() {
            document.getElementById('lessonPage').classList.remove('active');
            document.getElementById('main-container').classList.remove('slide-down');
        }
    </script>
</body>
</html>
